[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carivyo"
version = "0.1.0"
description = "Local-first verified job search and evidence-backed resume workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139.2,<1",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.51,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.32,<1",
  "pydantic-settings>=2.14,<3",
  "pypdf>=6.14,<7",
  "python-docx>=1.2,<2",
  "reportlab>=5,<6",
  "pillow>=12.3,<13",
  "structlog>=26.1,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "pytest-asyncio>=1.4,<2",
  "respx>=0.23,<1",
]

[project.scripts]
carivyo = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"
